name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sin atribución de IA (autoría del owner)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          # SHA real de la rama: en un PR, HEAD es un commit de merge que fabrica
          # GitHub y cuyo autor es quien abrió el PR — no el trabajo que se revisa.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          AUTHOR_PATTERN='claude|anthropic|copilot|\[bot\]'
          ATTRIB_PATTERN='co-authored-by:.*(claude|anthropic|copilot)|generated with|generated by|noreply@anthropic|🤖'
          FAIL=0
          RANGE="origin/$BASE_REF..$HEAD_SHA"
          if git log "$RANGE" --format='%an <%ae> / %cn <%ce>' | grep -inE "$AUTHOR_PATTERN"; then
            echo "::error::Autor o committer de IA detectado en los commits"
            FAIL=1
          fi
          if git log "$RANGE" --format='%B' | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::Atribución de IA detectada en mensajes de commit"
            FAIL=1
          fi
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::Atribución de IA detectada en el título o cuerpo del PR"
            FAIL=1
          fi
          exit $FAIL

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install --only-binary ':all:' --require-hashes -r requirements-ci.lock

      - name: Lint bash (shellcheck)
        run: shellcheck sync.sh install.sh

      - name: Lint Python (ruff)
        run: ruff check merge_settings.py tests/

      - name: Validate settings.shared.json
        run: |
          python3 - <<'EOF'
          import json, sys
          data = json.load(open("settings.shared.json"))
          for clave in ("attribution", "hooks"):
              if clave not in data:
                  sys.exit(f"falta la clave obligatoria: {clave}")
          for prohibida in ("model", "effortLevel"):
              if prohibida in data:
                  sys.exit(f"'{prohibida}' es estado por máquina — no puede ir en la política compartida")
          print("settings.shared.json OK")
          EOF

      - name: Unit tests (pytest)
        run: pytest tests/ -v
